name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: studio (core, server, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Some machines export NODE_ENV=production, which would skip devDependencies
      # (typescript, vitest, vite), so ask for them explicitly.
      - name: Install
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Build spec-core
        run: npm run build:core

      - name: Test spec-core
        run: npm run test -w @family/spec-core

      - name: Test server
        run: npm run test -w server

      - name: Test web
        run: npm run test -w web

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Spec quality report
        run: node scripts/eval.mjs

      - name: Build web
        run: npm run build -w web

  e2e:
    name: studio e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build spec-core
        run: npm run build:core

      - name: Run Playwright
        run: npm run test:e2e

  core:
    name: add-in core (c#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The Revit add-in itself needs the Revit API DLLs, which only exist on a
      # machine with Revit installed, so CI builds and tests FamilyAgent.Core.
      - name: Build core
        run: dotnet build revit-addin/FamilyAgent.Core/FamilyAgent.Core.csproj -c Release

      - name: Self-test
        run: dotnet run --project revit-addin/FamilyAgent.SelfTest/FamilyAgent.SelfTest.csproj -c Release
